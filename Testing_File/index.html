<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
    </style>
  </head>
  <body>
    <form action="">
      <input
        type="text"
        name="fullname"
        placeholder="Enter Name"
        id="fullname"
      />
      <input
        type="email"
        name="email"
        id="email"
        placeholder="Enter Email"
        itemid="email"
      />
      <input
        type="file"
        name="image"
        id="image"
        accept="image/png, image/jpeg, image/jpg, image/webp"
      />
      <button type="submit">Submit</button>
    </form>

    <script></script>
  </body>
</html>
